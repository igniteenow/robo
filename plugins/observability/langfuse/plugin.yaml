name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Robo — traces conversations, LLM calls, and tool usage. Opt-in via `robo plugins enable observability/langfuse` or `robo tools → Langfuse Observability`."
author: Robo
requires_env:
  - ROBO_LANGFUSE_PUBLIC_KEY
  - ROBO_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
