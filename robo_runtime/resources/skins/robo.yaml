name: robo
description: Robo — professional desktop engineer
# Colours for this skin live in robo_cli/skin_engine.py (one source of truth,
# audited for contrast by tests/robo_cli/test_skin_palettes.py). This file adds
# the banner art, tool emojis and wording on top.

spinner:
  # Restrained indicator: a rotating quadrant, no mascot faces.
  waiting_faces: ["◐", "◓", "◑", "◒"]
  thinking_faces: ["◐", "◓", "◑", "◒"]
  thinking_verbs:
    - analyzing
    - tracing dependencies
    - testing assumptions
    - checking evidence
    - engineering the next step
    - verifying the result
  wings:
    - ["", ""]

branding:
  agent_name: "Robo"
  welcome: "Robo online — talk normally or assign an engineering task."
  goodbye: "Robo standing by."
  response_label: " ROBO "
  prompt_symbol: "›"
  help_header: "ROBO COMMAND DECK"

tool_prefix: "┊"
tool_emojis:
  terminal: "▸"
  web_search: "⌕"
  browser: "◎"
  read_file: "≡"
  write_file: "✎"
  memory: "◇"

