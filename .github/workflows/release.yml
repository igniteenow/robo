name: Release

# Publishes a GitHub Release for every version tag, so each version has a page
# with its changes and a download, and the install/update E2E has a release to
# update users from.
#
# To release a version:
#   1. Bump it in the five files that declare it -- pyproject.toml,
#      robo_runtime/version.py, ROBO_VERSION, package.json,
#      apps/desktop/package.json -- refresh the two lockfiles (`uv lock` and
#      `npm install --package-lock-only`), and merge that to main.
#   2. Tag that commit on main and push the tag:
#        git fetch origin && git tag v3.0.2 origin/main && git push origin v3.0.2
#
# The job refuses a tag that does not match the version in the code, or one
# that is not on main, so a release always describes code that users get from
# `robo update`. It never creates or moves a tag itself. To publish a tag that
# already exists (the first release, say), run it by hand with that tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v3.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Full history: the on-main check needs origin/main and the tag's commit.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: The tag matches the version in the code
        run: python3 scripts/check_release_version.py "$TAG"

      - name: The tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "::error::$TAG is not on main. Tag a commit that is on main, so the release matches what robo update installs."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Install

          **Linux · macOS · WSL**

          ```bash
          git clone https://github.com/igniteenow/robo
          cd robo
          bash install-robo.sh
          ```

          **Windows (PowerShell)**

          ```powershell
          git clone https://github.com/igniteenow/robo
          cd robo
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\install-robo.ps1
          ```

          ## Update an existing install

          Run `robo update`, or click **Update now** when the desktop app says an update is ready.

          EOF
          gh release create "$TAG" \
            --verify-tag \
            --title "Robo ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --latest
